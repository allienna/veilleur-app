name: validate-specs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allowed-email invariant (3-location pin)
        run: scripts/check-allowed-email.sh
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"
      - uses: actions/setup-node@v4
        with:
          # pnpm 11.3 imports node:sqlite, available in Node 22.13+.
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Schema codegen in sync
        run: pnpm --filter @veilleur/shared run check

  infra:
    # Hermetic infra checks (F-007): Terraform format/validate (no GCP creds, no apply) + the
    # budget-killswitch function unit test. Real plan/apply is operator-run (see infra/RUNBOOK.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check
      - name: Terraform init (no backend)
        run: terraform -chdir=infra init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra validate
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Budget kill-switch function test
        run: uv run --with pytest pytest -q
        working-directory: functions/budget-killswitch
