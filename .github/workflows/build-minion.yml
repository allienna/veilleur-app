name: build-minion

on:
  push:
    branches: [main]
    paths:
      - "minion/**"
      - ".github/workflows/build-minion.yml"
  pull_request:
    paths:
      - "minion/**"
      - ".github/workflows/build-minion.yml"

jobs:
  build-minion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minion
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
