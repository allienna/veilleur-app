name: deploy-pwa

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "shared/**"
      - ".github/workflows/deploy-pwa.yml"
  pull_request:
    paths:
      - "pwa/**"
      - "shared/**"
      - ".github/workflows/deploy-pwa.yml"

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"
      - uses: actions/setup-node@v4
        with:
          # pnpm 11.3 imports node:sqlite, available in Node 22.13+.
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @veilleur/pwa run lint
      - name: Typecheck
        run: pnpm --filter @veilleur/pwa run typecheck
      - name: Build
        run: pnpm --filter @veilleur/pwa run build

  deploy:
    needs: build-pwa
    runs-on: ubuntu-latest
    # Guarded: F-009 ships a manual deploy path only (firebase.json + pwa/README;
    # `firebase deploy --only hosting`). CI auto-deploy (Workload Identity Federation)
    # is deferred to a later track.
    if: false
    steps:
      - run: echo "Deploy is operator-run for now — see pwa/README (F-009 Q4)."
