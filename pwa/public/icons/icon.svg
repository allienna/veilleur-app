<!-- The 🦉 mascot glyph (same emoji as AppHeader/AppFooter/EmptyState) rendered onto the brand
     navy square — one shared source of truth for "what the owl looks like" instead of hand-drawn
     artwork to keep in sync. Rounded corners: this is the non-maskable ("any" purpose) variant;
     see icon-maskable.svg for the full-bleed one Android/etc. crop into their own shape. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Le Veilleur">
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <text x="256" y="345" font-size="360" text-anchor="middle">🦉</text>
</svg>
