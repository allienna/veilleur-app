[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veilleur-minion"
version = "0.0.0"
description = "Veilleur Minion — one-shot Cloud Run Job that publishes a daily tech-watch synthesis article."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Aurélien Allienne", email = "allienne.a@sfeir.com" }]
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-cloud-firestore>=2.18",
    "google-cloud-secret-manager>=2.20",
    "google-genai>=0.3",
    "httpx>=0.27",
    "pillow>=10.4",
    # `email` extra pulls in email-validator, required by the generated PushSubscription model's
    # EmailStr field (F-012). pywebpush signs Web Push payloads with the VAPID private key.
    "pydantic[email]>=2.8",
    "pywebpush>=2.0",
    "python-json-logger>=2.0",
    "python-ulid>=2.0",
    # Local article extraction (F-015): in-container HTML→Markdown main-content extraction,
    # replacing the rate-limited Jina Reader free tier (PRD §5 amendment).
    "trafilatura>=2.0",
    "veilleur-shared",
]

[tool.uv.sources]
# Generated cross-boundary Pydantic models, packaged from shared/generated/veilleur_shared.
# Editable so `pnpm gen` output is picked up without reinstalling.
veilleur-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gated real-`claude` test (F-005 AD-11) is deselected by default so CI/build-minion stays
# hermetic; run it explicitly with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: exercises the real `claude` CLI / plugin (needs the binary + OAuth token; off by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "T20", # flake8-print (constitution §4: no print outside structured-log boundary)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/minion/spike/logging.py" = ["T20"]  # logger may need print fallback during bootstrap

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
# spike/ is throwaway F-001 plumbing slated for deletion; not held to strict typing (F-002 AC-2).
exclude = ["**/__pycache__", "**/.venv", "src/minion/spike"]
reportMissingTypeStubs = false  # google SDKs ship incomplete stubs
